name: Deploy Infrastructure (US East 1)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

# 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # TAMBAHKAN INI
          aws-region: us-east-1

      # ─────────────────────────────
      # 04 - Beanstalk
      # ─────────────────────────────
      - name: Deploy Beanstalk Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudform_aws_practice-main/cloudformation/04-beanstalk.yaml \
            --stack-name myapp-beanstalk \
            --parameter-overrides DBPassword=${{ secrets.DB_PASSWORD }} \
            --capabilities CAPABILITY_NAMED_IAM
