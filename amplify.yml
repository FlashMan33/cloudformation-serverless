version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Masuk ke folder aplikasi kamu yang berlapis
        - cd cloudform_aws_practice-main/frontend
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    # Arahkan ke folder dist di dalam subfolder
    baseDirectory: cloudform_aws_practice-main/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - cloudform_aws_practice-main/frontend/node_modules/**/*
