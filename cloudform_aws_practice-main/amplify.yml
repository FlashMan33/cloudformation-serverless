version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pindah ke folder tempat package.json berada
        - cd cloudform_aws_practice-main/frontend
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    # Lokasi hasil build relatif terhadap folder frontend
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
