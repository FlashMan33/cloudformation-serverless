AWSTemplateFormatVersion: '2010-09-09'
Description: 'STACK 5 - Lambda Functions Python 3.12 (Learner Lab Compatible)'

Parameters:
  DBPassword:
    Type: String
    NoEcho: true

Resources:

  # ─────────────────────────────────────────────
  # LAMBDA POST FUNCTION
  # ─────────────────────────────────────────────
  LambdaPostFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: myapp-post-handler
      Description: Insert data ke RDS PostgreSQL
      Runtime: python3.12
      Handler: handler.lambda_handler

      # 🔥 WAJIB: pakai LabRole (bukan IAM custom)
      Role: arn:aws:iam::581967380620:role/LabRole

      Timeout: 30
      MemorySize: 256

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "body": json.dumps({"message": "POST placeholder"})
              }

      Environment:
        Variables:
          DB_HOST: !ImportValue myapp-DBEndpoint
          DB_PORT: '5432'
          DB_NAME: myappdb
          DB_USER: myappuser
          DB_PASSWORD: !Ref DBPassword

      VpcConfig:
        SubnetIds:
          - !ImportValue myapp-PrivateSubnet1Id
          - !ImportValue myapp-PrivateSubnet2Id
        SecurityGroupIds:
          - !ImportValue myapp-LambdaSGId

      Tags:
        - Key: Name
          Value: myapp-post-handler

  # ─────────────────────────────────────────────
  # LAMBDA GET FUNCTION
  # ─────────────────────────────────────────────
  LambdaGetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: myapp-get-handler
      Description: Ambil data dari RDS PostgreSQL
      Runtime: python3.12
      Handler: handler.lambda_handler

      # 🔥 WAJIB: pakai LabRole
      Role: arn:aws:iam::581967380620:role/LabRole

      Timeout: 30
      MemorySize: 256

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "body": json.dumps({"data": [], "statistics": []})
              }

      Environment:
        Variables:
          DB_HOST: !ImportValue myapp-DBEndpoint
          DB_PORT: '5432'
          DB_NAME: myappdb
          DB_USER: myappuser
          DB_PASSWORD: !Ref DBPassword

      VpcConfig:
        SubnetIds:
          - !ImportValue myapp-PrivateSubnet1Id
          - !ImportValue myapp-PrivateSubnet2Id
        SecurityGroupIds:
          - !ImportValue myapp-LambdaSGId

      Tags:
        - Key: Name
          Value: myapp-get-handler

  # ─────────────────────────────────────────────
  # LOG GROUPS
  # ─────────────────────────────────────────────
  PostLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/myapp-post-handler
      RetentionInDays: 14

  GetLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/myapp-get-handler
      RetentionInDays: 14

  # ─────────────────────────────────────────────
  # CLOUDWATCH ALARM
  # ─────────────────────────────────────────────
  PostLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: myapp-post-lambda-errors
      AlarmDescription: Alarm jika error > 5 dalam 5 menit
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaPostFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:

  PostLambdaArn:
    Value: !GetAtt LambdaPostFunction.Arn
    Export:
      Name: myapp-PostLambdaArn

  GetLambdaArn:
    Value: !GetAtt LambdaGetFunction.Arn
    Export:
      Name: myapp-GetLambdaArn

  PostLambdaName:
    Value: !Ref LambdaPostFunction
    Export:
      Name: myapp-PostLambdaName

  GetLambdaName:
    Value: !Ref LambdaGetFunction
    Export:
      Name: myapp-GetLambdaName
